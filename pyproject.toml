[project]
name = "sinar"
version = "0.1.0"
description = "A library for generating synthetic spectra."
readme = "README.md"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "diag_*.py"]
markers = [
    "diagnostic: produces plots for visual inspection; not run by default",
]
addopts = "-m 'not diagnostic'"